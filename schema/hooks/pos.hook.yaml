# =============================================================================
# pos Hooks — cashier-session + ticket lifecycle and write-path rules
# =============================================================================
# Declarative spec of the validated write surface in src/application/service/
# (pos_write_service.rs and its chunks: pos_sale, pos_tender, pos_recognition,
# pos_drawer, pos_receipt, pos_sync, pos_compute, pos_discount, pos_session_alert),
# proven by tests/ (pos_golden_cases, integrity_probes, pos_cash_movement,
# pos_receipt, tenancy_posture_probe, retail_sale_seam, pos_sync_ui, pos_tax_compute,
# pos_restaurant, pos_session_alert).
#
# ADR-0015 enforcement vocabulary: db = a DB object (CHECK / unique index / enum /
# trigger) enforces it on every write path incl. raw SQL; service = write-path only;
# both = DB backstop + service pre-check (friendly 422 instead of a 500).
#
# POS posts NO GL itself — on recognition it drives billing + payment through ports;
# every money rule below guards the ticket/session shape it hands them.

module: pos
version: 2

# -----------------------------------------------------------------------------
# State machines - one per entity that has a status lifecycle.
# -----------------------------------------------------------------------------
state_machines:
  # The cashier session. Opened with a per-method float; ONE close (the Z-report).
  # There is deliberately no reopen: a closed session is terminal, and every write
  # path (ring, tender, cash movement, x-report) re-checks status='open' first.
  - entity: PosOpeningEntry
    field: status
    verbs: hand
    initial: open
    states: [open, closed]
    transitions:
      - { from: open, to: closed, on: close_session }

  # The counter ticket. draft while being rung/tendered; paid once recognised
  # (billing invoice raised + tender settled); returned reverses a paid ticket
  # (credit note + refund; a linked is_return ticket records the reversal).
  # 'consolidated' and 'void' are enum values reserved for later work
  # (end-of-day consolidation into a single invoice; ticket voiding) — no live
  # transition emits them in this module version; stated here so the enum shape
  # on record matches pos_invoice_status.
  - entity: PosInvoice
    field: status
    verbs: hand
    initial: draft
    states: [draft, paid, consolidated, returned, void]
    transitions:
      - { from: draft, to: paid,     on: recognize_sale }
      - { from: paid,  to: returned, on: return_sale }

  # Register configuration lifecycle (status replaced the active boolean).
  - entity: PosProfile
    field: status
    verbs: hand
    initial: active
    states: [active, inactive]
    transitions:
      - { from: active,   to: inactive, on: deactivate }
      - { from: inactive, to: active,   on: reactivate }

# -----------------------------------------------------------------------------
# Write-path rules - validated before any write. Each maps to a stable error_code
# (PosError) and to the test that proves it.
# -----------------------------------------------------------------------------
rules:
  - id: R1
    name: session_must_be_open
    entity: PosOpeningEntry
    when: ringing/tendering/cash_movement/x_report/close
    assert: "the opening entry exists, belongs to the caller's scope, and status == 'open'"
    error_code: session_not_open
    enforcement: service
    justification: "PARTLY: ringing, cash movements, the X report, close and sync read the session and refuse unless it is open, but add_tender never reads the session, the reads take no lock, and close_session reads status outside its transaction while mark_closed flips without an open predicate. Scope rides the composing service's fence alone."
    note: "every write path reads the session status through the org-scoped helpers (the composing service's tenancy decorator fences the lookup so an out-of-scope session is simply not found) and refuses unless open; close_session flips status inside the closing transaction so a counted drawer always closes the session"

  - id: R2
    name: one_open_session_per_config
    entity: PosOpeningEntry
    when: opening_session
    assert: "no other session with status='open' exists for the same register (pos_profile_id) — the decorator's org-scoped partial unique enforces it per unit"
    error_code: session_already_open
    enforcement: both
    justification: "PARTLY: open_session pre-reads for an open session without a lock and maps a unique violation on pos_profile_id, but no module index survives: the partial unique this rule names was dropped and its replacement left with tenancy (strip_tenancy). The composing service's tenancy posture installs the per-unit unique that closes the race."
    note: "DB arm: partial unique index idx_pos_opening_entries_pos_profile_id WHERE status='open' AND deleted_at IS NULL; service arm maps the insert's unique violation to a friendly 422 (constraint-name discrimination on pos_profile_id)"

  - id: R3
    name: non_empty_basket
    entity: PosInvoice
    when: ringing
    assert: "count(lines) >= 1"
    error_code: empty_document
    enforced_by: "src/application/service/pos_sale.rs::ring_sale, src/application/service/pos_sale.rs::ring_sale_priced, src/application/service/pos_compute.rs::compute_ticket"
    enforcement: service
    justification: "The header and its lines commit in ONE transaction, so at the moment the header is written there are no lines yet for a constraint to count. The verb knows the whole document before it writes any of it."
    note: "a header-only ticket is inert (totals default 0) and the guarded surface is the only creator; a deferred trigger would be needed for a DB arm — revisit if a raw writer ever creates tickets"

  - id: R4
    name: non_negative_line_money
    entity: PosInvoiceItem
    when: ringing
    assert: "line.quantity >= 0 AND line.unit_price >= 0 AND line.discount_amount >= 0 AND line.net_amount >= 0"
    error_code: negative_amount
    enforcement: both
    justification: "PARTLY: compute_ticket refuses a negative quantity, price, discount or net, but the net the tax port returns replaces the checked net unchecked, and the database arm is unnamed column CHECKs whose refusal answers 500."
    note: "DB arm: CHECK constraints on pos_invoice_items (quantity, unit_price, discount_amount, net_amount) and on the ticket totals; service arm returns a friendly 422 before any insert"

  - id: R5
    name: server_owned_tax
    entity: PosInvoice
    when: ringing
    assert: "tax_total is computed server-side from the register's tax templates through the tax compute port; no request field carries a tax amount"
    error_code: none
    enforced_by: "src/application/service/pos_compute.rs::compute_ticket"
    enforcement: service
    justification: "The rule is that a client-supplied total is IGNORED, not that a stored total is well-formed. Recomputing server-side is the enforcement; a CHECK comparing columns would still be checking numbers the client chose."
    note: "compute-time: compute_ticket sums the components the tax port returns for the register's templates and refuses a register with none — a merchant can neither omit nor overstate the VAT"

  - id: R6
    name: receipt_number_unique
    entity: PosInvoice
    when: ringing
    assert: "receipt_number is unique among non-deleted tickets"
    error_code: duplicate_number
    enforced_by: "migrations/20260426220002_create_pos_invoice_table.up.sql::idx_pos_invoices_receipt_number, src/application/service/pos_write_service.rs::map_invoice_dup"
    enforcement: both
    justification: "The index is global rather than per unit, and the return ticket's insert maps no duplicate, so a collision there answers 500."
    note: "DB arm: partial unique index idx_pos_invoices_receipt_number WHERE deleted_at IS NULL; service arm maps the unique violation to a friendly 422 (is_dup on the insert error)"

  - id: R7
    name: tender_draft_only
    entity: PosPayment
    when: adding_tender
    assert: "ticket.status == 'draft'"
    error_code: not_draft
    enforced_by: "src/application/service/pos_tender.rs::add_tender, src/infrastructure/persistence/pos_invoice_repository.rs::fetch_tender_header, src/application/service/pos_sync.rs::sync_update_draft, src/infrastructure/persistence/pos_invoice_repository.rs::lock_for_sync_on"
    enforcement: service
    justification: "A state gate on the ticket the tender is paid against, read under the ticket's row lock: a tender and the paid flip queue on that row, so a tender after the flip sees paid and is refused, and a sync replay locks the ticket before it rewrites anything."
    note: "the header is read FOR UPDATE before the tender insert; recognition's flip is itself a gated UPDATE (WHERE status='draft') on the same row, so a racing tender cannot land on a paid ticket"

  - id: R8
    name: tender_positive
    entity: PosPayment
    when: adding_tender
    enforced_by: "src/application/service/pos_tender.rs::add_tender, src/application/service/pos_sync.rs::sync_write_children"
    assert: "amount > 0"
    error_code: negative_amount
    enforcement: both
    note: "DB arm: pos_payments.amount CHECK (amount >= 0); the service is stricter (refuses zero too) and rounds to 2dp before insert"

  - id: R9
    name: change_only_overpayment
    entity: PosInvoice
    when: adding_tender
    assert: "change_due == max(paid_total - rounded_total, 0), cash only"
    error_code: none
    enforced_by: "src/application/service/pos_tender.rs::add_tender, src/application/service/pos_tender.rs::check_change_is_cash, src/application/service/pos_sync.rs::check_replay_change_is_cash"
    enforcement: both
    justification: "Change is the overpayment, and only cash may overpay: a tender other than cash covers at most what is still due, on the online tender and on the replay, so the change the drawer hands back is always cash it took."
    note: "DB arm: pos_invoices.change_due CHECK (change_due >= 0); the re-sum (sum_paid_total_on) and the change computation commit in the tender's own transaction"

  - id: R10
    name: recognize_fully_tendered
    entity: PosInvoice
    when: recognizing
    enforced_by: "src/application/service/pos_recognition.rs::recognize_sale"
    assert: "paid_total >= rounded_total"
    error_code: not_fully_tendered
    enforcement: service
    justification: "The comparison holds on the header read at recognition; tenders re-sum under the ticket's row lock, so the paid total it reads includes every tender taken."
    note: "checked on the freshly-read ticket before driving billing/payment; recognition is replay-safe so a retry after a late tender succeeds"

  - id: R11
    name: accounts_present_when_needed
    entity: PosInvoice
    when: recognizing
    assert: "tax_total > 0 => register tax account; always: receivable + cash accounts; customer on the ticket or the profile default; every line a revenue account (line or profile income)"
    error_code: missing_account
    enforced_by: "src/application/service/pos_recognition.rs::recognize_sale"
    enforcement: service
    justification: "Presence is checked; which account is not: a line's revenue account comes from the request and is used as given."
    note: "the handoff needs the GL seats it debits/credits; POS posts no GL itself, so refusing early keeps billing/payment from receiving an unbookable request"

  - id: R12
    name: recognition_at_most_once
    entity: PosInvoice
    when: recognizing
    assert: "a retry reuses the raised billing invoice (billing_invoice_id persisted while still draft) and the draft->paid flip is a gated UPDATE; replay returns the persisted billing/payment ids"
    error_code: none
    enforced_by: "src/application/service/pos_recognition.rs::recognize_sale, src/infrastructure/persistence/pos_invoice_repository.rs::link_billing_invoice, src/infrastructure/persistence/pos_invoice_repository.rs::mark_paid, src/application/service/pos_recognition.rs::relieve_stock_once"
    enforcement: service
    justification: "Idempotency across a boundary. Recognition of one ticket runs under a transaction-scoped advisory lock on its id, so a second delivery waits and then reuses the linked invoice or finds the ticket paid; the link only takes on a draft with none; the stock relief is driven by the ticket's own record of its delivery note, so a refused relief is retried and a recorded one never repeats."
    note: "procedural by construction (cross-service orchestration); a decline-then-retry at the counter must not double the revenue journal — billing does not dedup on the POS ticket"

  - id: R13
    name: return_from_paid
    entity: PosInvoice
    when: returning
    assert: "original.status in ('paid','returned') AND billing_invoice_id present"
    error_code: not_returnable
    enforced_by: "src/application/service/pos_recognition.rs::return_sale"
    enforcement: service
    justification: "The return is gated on the ORIGINAL ticket's state and on its invoice existing in billing. Neither is visible from the return row a constraint would be attached to."

  - id: R14
    name: return_exactly_once
    entity: PosInvoice
    when: returning
    assert: "the return ticket + event are gated on the original's paid->returned flip; both downstream reversals (refund, credit note) are idempotent; a repeat return reuses the existing return ticket"
    error_code: none
    enforcement: service
    justification: "PARTLY: the flip to returned and the return ticket's insert are separate statements outside a transaction, so a crash between them leaves a returned original with no return ticket, and the replay then answers with the original's own id."
    note: "partial returns are a declared forward seam: the line-subset input is accepted but refused (partial_returns_not_implemented) until billing's credit note honors a line subset"

  - id: R15
    name: cash_movement_kind_and_amount
    entity: PosCashMovement
    when: recording_cash_movement
    assert: "movement_type in (pay_in, pay_out, drop, no_sale); no_sale => amount == 0; others => amount > 0"
    error_code: invalid_cash_movement
    enforced_by: "src/application/service/pos_drawer.rs::record_cash_movement"
    enforcement: both
    justification: "The movement's register is not checked against its session's."
    note: "DB arm: the pos_cash_movement_type enum rejects unknown kinds and amount CHECK (amount >= 0); the amount-vs-type rule is service-side (no DB CHECK expresses it); close_session folds the net (pay_in - pay_out - drop) into the expected cash drawer"

  - id: R16
    name: close_persists_reconciliation
    entity: PosClosingEntry
    when: closing
    assert: "the closing entry (per-method expected vs counted + difference_total) and the session's flip to closed commit in ONE transaction"
    error_code: none
    enforcement: service
    justification: "PARTLY: the closing entry and the flip commit together, but the drawer is computed and the variance booked outside that transaction, mark_closed has no open predicate, and no unique index stops a second closing entry for the same session."
    note: "a drawer is never counted without the session closing; the expected-drawer computation is shared with the mid-shift x_report (compute_drawer) so the two reads cannot drift"

  - id: R17
    name: tender_event_once_on_crossing
    entity: PosPayment
    when: adding_tender
    assert: "PosTenderCompleted is emitted (and outbox-staged when configured) exactly on the tender that crosses full payment — never re-emitted on extra tenders"
    error_code: none
    enforced_by: "src/application/service/pos_tender.rs::add_tender, src/application/service/pos_sync.rs::crosses_full_payment"
    enforcement: service
    justification: "The event fires on the tender that CROSSES full payment, known by comparing the paid total before and after under the ticket's row lock; a replay fires only when the ticket was not paid up before it."
    note: "the outbox record carries the ambient org scope's legacy company echo as its top-level fence field (ADR-0011 wire shape; the column lives in the composing service's outbox, not here — ADR-0029); double-delivery is a no-op because recognition is replay-safe"

  - id: R18
    name: one_draft_per_table
    entity: PosInvoice
    when: ringing/seating/transferring
    assert: "a dining table holds at most one ticket with status='draft'; the reference merges client-side — this port refuses the second draft instead"
    error_code: table_occupied
    enforced_by: "migrations/20260824100010_add_pos_table_ref_and_course_grouping.up.sql::idx_pos_invoices_pos_table_id, src/application/service/pos_sale.rs::ring_sale, src/application/service/pos_sync.rs::sync_create_draft, src/application/service/pos_sync.rs::sync_update_draft, src/infrastructure/persistence/pos_invoice_repository.rs::find_draft_on_table, src/application/service/pos_write_service.rs::map_invoice_dup"
    enforcement: both
    note: "DB arm: partial unique index idx_pos_invoices_pos_table_id WHERE status='draft' AND pos_table_id IS NOT NULL AND deleted_at IS NULL (relaxes the moment the draft leaves draft); service arm pre-checks occupancy (excluding the ticket itself on transfer, so a transfer onto its own table is a no-op seat) and maps the raced unique violation to the same typed 409 carrying the occupying ticket id"

  - id: R19
    name: named_table_must_exist
    entity: PosInvoice
    when: ringing/seating/transferring
    assert: "a ticket naming a pos_table_id seats at a table that exists in the caller's tenant"
    error_code: table_not_found
    enforced_by: "src/application/service/pos_sale.rs::ring_sale, src/application/service/pos_sync.rs::sync_create_draft, src/application/service/pos_sync.rs::sync_update_draft, src/infrastructure/persistence/pos_table_repository_custom.rs::fetch_table"
    enforcement: service
    justification: "The table must exist in the caller's tenant, so the check is a scoped read rather than a plain reference: a row that exists for another tenant must read as absent, which a foreign key cannot express."
    note: "a soft-deleted or out-of-scope table id is simply not found (the lookup rides the caller's relayed transaction under the composing service's fence); the seating is a UI affordance, not money — but a silent unseated ring would hide the mistake from the floor plan"

  - id: R20
    name: order_discount_server_priced
    entity: PosInvoice
    when: ringing/syncing
    assert: "the order-level discount RATE is read from the tenant's pos_discounts master row; a client-supplied rate has no field to land in, the register must have allow_discount, and the fold lands on line discount_amounts BEFORE the tax compute (tax sees post-discount nets)"
    error_code: discount_not_found | discount_not_allowed | discount_invalid
    enforced_by: "src/application/service/pos_discount.rs::resolve_order_discount, src/application/service/pos_discount.rs::fold_order_discount, src/infrastructure/persistence/pos_discount_repository_custom.rs::fetch_discount"
    enforcement: both
    justification: "This rule prices the ORDER discount. A line discount still arrives in the request and is bounded only by the line's gross, whether or not the register allows discounts."
    note: "DB arm: pos_discounts.percentage CHECK (percentage >= 0) bounds the master at storage; service arm resolves the master tenant-scoped, gates on the register, re-fences the rate to [0,1] at read time, folds pro-rata by line gross (per-line money-rounded, refusing a combined discount that exceeds a line's gross), and the partial-unique/constraint rules above keep the ticket itself consistent"

  - id: R21
    name: loyalty_point_deltas_not_accepted
    entity: PosInvoice
    when: always
    assert: "no POS input surface, DTO field, or table column accepts a client-authored loyalty point delta; points are out of scope for this module"
    error_code: none
    enforcement: service
    justification: "The rule is about what the module's surface REFUSES to accept: no input, DTO field or column takes a client-authored point delta. That is a statement about the absence of a write path, which no constraint can make."
    note: "trust posture by construction (the reference lets clients author point deltas — that is the seam this port closes): the earn/redeem decisions belong to the promo seam (coupon_code in, reward_lines out) or a future loyalty consumer of PosInvoicePaid; nothing in pos mutates a points balance"

  - id: R22
    name: stale_session_alert_once
    entity: PosOpeningEntry
    when: alert_old_sessions (scheduled)
    assert: "an open session older than the threshold (7 days default) is alerted at most once — the claim stamps metadata->'stale_session_alerted_at' in the same transaction (single_transaction commit policy) under FOR UPDATE SKIP LOCKED"
    error_code: none
    enforced_by: "src/application/service/pos_session_alert.rs::alert_old_sessions, src/infrastructure/persistence/pos_opening_entry_repository.rs::claim_stale_sessions, src/infrastructure/persistence/pos_opening_entry_repository.rs::mark_stale_alerted"
    enforcement: service
    justification: "The once-only latch is stamped in the same transaction as the claim that takes the session, so a second sweep finds nothing to alert. A constraint on the stamp could not stop two sweeps from both deciding to alert."
    note: "the latch is the durable record; events are emitted after the latch commits, so a crash between commit and emit loses one alert run (re-derivable) rather than re-alerting forever; the handler is per-unit — the composing host enumerates active org units and rides its own daily schedule (ADR-0020 host_riding)"

# -----------------------------------------------------------------------------
# Domain events (emission is the service's responsibility; sink or outbox).
# -----------------------------------------------------------------------------
events:
  PosSessionOpened:
    when: "open_session commits"
    payload: [opening_entry_id, pos_profile_id, company_id]
  PosTenderCompleted:
    when: "a tender crosses full payment (R17)"
    payload: [pos_invoice_id, company_id]
  PosInvoicePaid:
    when: "the draft->paid flip commits (recognition)"
    payload: [pos_invoice_id, company_id, grand_total, rounded_total, billing_invoice_id, payment_id]
  PosInvoiceReturned:
    when: "the paid->returned flip commits (return)"
    payload: [pos_invoice_id, return_ticket_id, company_id, billing_invoice_id, amount]
  PosSessionClosed:
    when: "close_session commits"
    payload: [closing_entry_id, opening_entry_id, company_id, difference_total]
  PosStaleSessionAlerted:
    when: "the old-session alert job latches a stale open session (R22)"
    payload: [opening_entry_id, pos_profile_id, company_id, cashier_party_id, opened_at]
