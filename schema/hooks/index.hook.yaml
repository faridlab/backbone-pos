# pos Module - Hooks Index
# Version: 2.0
#
# Module-level configuration for hooks (lifecycle behaviors).
# Hooks define: state machines, rules, permissions, triggers, computed fields.

module: pos
version: 2

# Import all hook files.
imports:
  - pos.hook.yaml

# =============================================================================
# Module-level configuration
# =============================================================================
config:
  audit:
    retention_days: 365
    archive_after_days: 90
    critical_events: []

  notifications:
    email_enabled: false
    sms_enabled: false
    push_enabled: false

# =============================================================================
# Shared domain events
# =============================================================================
events:
  stale_session_alerted:
    description: >-
      An open cashier session crossed the stale threshold (7 days by default). Emitted by the
      old-session alert job after its once-only latch committed. A LOGICAL LINK for the mail
      activity choreography — this module has NO Cargo edge to any mail crate; the composing
      service subscribes and schedules the "Session open too long" activity on the cashier
      (a party ref the event carries).

# =============================================================================
# Scheduled jobs
# =============================================================================
# The ported old-session alert (reference: pos.session._alert_old_session — for every
# non-closed session older than 7 days with no such activity yet, schedule a "Session open
# over 7 days" activity on the session's user; in the reference tree it owns no cron row and
# piggy-backs the stock scheduler).
#
# Posture ruling (ADR-0020): host_riding. The reference shape rides the stock scheduler
# (no native cron), and no backbone module declares that scheduler yet — so the COMPOSING
# SERVICE is the host: it runs a daily schedule and calls the module's per-company handler
# (`PosWriteService::alert_old_sessions`) once per company. The module itself never does a
# cross-tenant read. The once-only latch (metadata->'stale_session_alerted_at', stamped in
# the same transaction as the SKIP LOCKED claim) keeps a daily run from re-alerting a session.
scheduled_jobs:
  alert_old_sessions:
    schedule: "daily 03:00"
    handler: "pos::alert_old_sessions"
    posture: host_riding
    triggers: []
    commit_policy: single_transaction
    pickup_lock: true
