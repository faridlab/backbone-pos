# =============================================================================
# Domain: POS
# Entities: PosInvoice (the sale ticket) + PosInvoiceItem + PosPayment (tender)
# Description: A counter sale. Region-neutral: no tax rules here (tax lines are
# billing/tax's job); POS carries a supplied `tax_total`. On recognition POS asks
# billing to raise the real Sales Invoice (revenue) and payment to settle the
# tender — `billing_invoice_id` links the result. Multi-tender; `change_due` is
# cash overpayment. Rounding is IDR receipt rounding.
# =============================================================================

models:
  - name: PosInvoice
    collection: pos_invoices
    description: "A POS counter sale ticket"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique ticket id"
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"
      pos_profile_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The register # logical FK to PosProfile.id"
      opening_entry_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PosOpeningEntry.id)"]
        description: "The session this sale rings against"
      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Outlet # logical FK to organization.Branch.id"
      customer_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Customer # logical FK to party.Party.id (walk-in if null)"
      receipt_number:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Receipt number (unique)"
      posting_at:
        type: datetime
        attributes: ["@required"]
        description: "Sale timestamp"
      net_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ line net amounts (pre-tax)"
      tax_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Supplied tax total (PPN; computed by tax/billing)"
      grand_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "net_total + tax_total"
      rounding_adjustment:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)"]
        description: "rounded_total − grand_total (IDR receipt rounding; may be negative)"
      rounded_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "The amount actually charged (grand_total + rounding_adjustment)"
      paid_total:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ tender amounts"
      change_due:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Cash overpayment returned (paid_total − rounded_total, cash only)"
      billing_invoice_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The real Sales Invoice billing raised # logical FK to billing.SalesInvoice.id"
      payment_entry_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The PaymentEntry that settled this ticket, persisted at recognition so a return can refund the tender without a cross-schema lookup # logical FK to payment.PaymentEntry.id"
      is_return:
        type: bool
        attributes: ["@default(false)"]
        description: "A return/refund ticket"
      return_against:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The original sale this returns # logical FK to PosInvoice.id"
      status:
        type: PosInvoiceStatus
        attributes: ["@default(draft)"]
        description: "Ticket lifecycle"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      items:
        type: PosInvoiceItem[]
        attributes: ["@one_to_many"]
        description: "Sale lines"
        inverse: invoice
      payments:
        type: PosPayment[]
        attributes: ["@one_to_many"]
        description: "Tender lines"
        inverse: invoice

    indexes:
      - type: unique
        fields: [receipt_number]
        where: "deleted_at IS NULL"
      - type: index
        fields: [company_id, opening_entry_id, status]

  - name: PosInvoiceItem
    collection: pos_invoice_items
    description: "One sale line"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      pos_invoice_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PosInvoice.id)"]
        description: "Owning ticket"
      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"
      description:
        type: string?
        attributes: ["@max(300)"]
        description: "Line label"
      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@non_negative"]
        description: "Quantity sold"
      unit_price:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Price per unit (promo-resolved)"
      discount_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Line discount"
      net_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "money(qty*price) − discount"
      revenue_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Income account for this line # logical FK to accounting.Account.id"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      invoice:
        type: PosInvoice
        attributes: ["@one", "@foreign_key(pos_invoice_id)"]
        description: "Owning ticket"
        inverse: items

    indexes:
      - type: index
        fields: [pos_invoice_id]

  - name: PosPayment
    collection: pos_payments
    description: "One tender line against a ticket"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique tender id"
      pos_invoice_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PosInvoice.id)"]
        description: "Owning ticket"
      payment_method:
        type: PosPaymentMethod
        attributes: ["@required"]
        description: "How the customer paid"
      amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Tendered amount"
      reference_no:
        type: string?
        attributes: ["@max(140)"]
        description: "Card/QRIS/e-wallet reference"
      payment_entry_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The payment.PaymentEntry that settled this # logical FK to payment.PaymentEntry.id"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      invoice:
        type: PosInvoice
        attributes: ["@one", "@foreign_key(pos_invoice_id)"]
        description: "Owning ticket"
        inverse: payments

    indexes:
      - type: index
        fields: [pos_invoice_id]

enums:
  - name: PosInvoiceStatus
    description: "POS ticket lifecycle"
    variants:
      - name: draft
        description: "Ringing up / awaiting tender"
        default: true
      - name: paid
        description: "Fully tendered + recognised (billing invoice + settlement)"
      - name: consolidated
        description: "Rolled into a consolidated billing invoice"
      - name: returned
        description: "Reversed by a return ticket"
      - name: void
        description: "Voided before recognition"

  - name: PosPaymentMethod
    description: "Tender channel"
    variants:
      - name: cash
        description: "Physical cash (can give change)"
        default: true
      - name: card
        description: "Debit/credit card"
      - name: qris
        description: "QRIS"
      - name: e_wallet
        description: "E-wallet (GoPay/OVO/DANA/ShopeePay)"
      - name: bank_transfer
        description: "Bank transfer"
      - name: virtual_account
        description: "Bank virtual account"
