# =============================================================================
# pos Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA pos` and qualify tables
# as `pos.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: pos
version: 2
schema: pos
description: "pos domain module"

# ADR-0014 company fence: every entity here is company-scoped and fenced strict — the register
# config (pos_profiles), the cashier session (pos_opening_entries), the ticket (pos_invoices)
# plus its parent-scoped children (pos_invoice_items, pos_payments — company_id denormalised
# onto each child row per ADR-0010 Decision A), the close/Z-report (pos_closing_entries), and
# the non-sale drawer movements (pos_cash_movements). No config-table exceptions: a register
# belongs to exactly one company's books, so pos_profiles is fenced like every other entity.
company_fence: strict

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model.
imports:
  - pos_profile.model.yaml
  - pos_invoice.model.yaml
  - pos_closing.model.yaml
