# =============================================================================
# Domain: POS
# Entities: PosProfile (register config) + PosOpeningEntry (till open / session)
# Description: A PosProfile configures a register (the outlet + the GL accounts the
# sale/tender handoff needs). A PosOpeningEntry opens a cashier session with an
# opening float per tender method; sales ring against the open session, and it is
# reconciled at close. POS carries the account refs it hands to billing/payment —
# it never posts the GL itself.
# =============================================================================

models:
  - name: PosProfile
    collection: pos_profiles
    description: "Register configuration for a POS outlet"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique profile id"
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"
      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Outlet # logical FK to organization.Branch.id"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Register name"
      default_customer_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Walk-in default customer # logical FK to party.Party.id"
      currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "ISO currency code"
      income_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Revenue account for the sale # logical FK to accounting.Account.id"
      receivable_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "A/R control the sale debits (settled immediately by tender) # logical FK to accounting.Account.id"
      cash_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Cash/Bank the tender lands in # logical FK to accounting.Account.id"
      write_off_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Over/short write-off at close # logical FK to accounting.Account.id"
      tax_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "PPN output-tax liability account; set for a PKP register # logical FK to accounting.Account.id"
      tax_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(6,4)", "@non_negative"]
        description: "Retired flat PPN rate (kept for historical receipts only — new tickets compute tax document-grade through the register's tax_template_ids)"
      tax_template_ids:
        type: json?
        description: "Tax templates applied to every sale line at this register — [template id, ...]; logical refs to tax.TaxTemplate.id. NULL or empty refuses ringing: a register must be tax-configured (a zero-rated template represents a non-PKP register)"
      warehouse_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Register's issuing warehouse; set to decrement stock on recognition # logical FK to inventory.Warehouse.id"
      cogs_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Cost-of-goods-sold account the stock issue debits # logical FK to accounting.Account.id"
      inventory_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Inventory asset account the stock issue credits # logical FK to accounting.Account.id"
      allow_discount:
        type: bool
        attributes: ["@default(true)"]
        description: "Whether line discounts are permitted"
      cash_rounding_strategy:
        type: PosCashRoundingStrategy
        attributes: ["@default(none)"]
        description: "How the charged total is rounded to cash at this register"
      cash_rounding_unit:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Cash rounding multiple (e.g. 100 = nearest hundred); 0 with strategy none = exact totals"
      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: PosProfileStatus
        attributes: ["@default(active)"]
        description: "Lifecycle (only an active register can open a session)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [company_id, status]

  - name: PosOpeningEntry
    collection: pos_opening_entries
    description: "A cashier session (till open) — sales ring against it until it closes"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique session id"
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK to organization.Company.id"
      pos_profile_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PosProfile.id)"]
        description: "The register"
      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Outlet # logical FK to organization.Branch.id"
      cashier_party_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Cashier # logical FK to party.Party.id"
      opened_at:
        type: datetime
        attributes: ["@required"]
        description: "When the till opened"
      opening_balances:
        type: json?
        description: "Opening float per method — [{ method, amount }]"
      status:
        type: PosSessionStatus
        attributes: ["@default(open)"]
        description: "Session state"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [company_id, pos_profile_id, status]
      # One non-closed session per register: opening a second session on a
      # register that still has an open one must be refused, not forked.
      - type: unique
        fields: [pos_profile_id]
        where: "status = 'open' AND deleted_at IS NULL"

enums:
  - name: PosCashRoundingStrategy
    description: "Cash rounding mode applied to a ticket's charged total"
    variants:
      - name: none
        description: "No rounding; the charged total is exact"
        default: true
      - name: half_up
        description: "Round HALF-UP to the nearest multiple of the profile's cash_rounding_unit (a difference of at most unit/2 is absorbed into rounding_adjustment)"

  - name: PosProfileStatus
    description: "Lifecycle of a POS register profile"
    variants:
      - name: active
        description: "The register can open a session"
        default: true
      - name: inactive
        description: "Retired register; historical sessions remain readable"

  - name: PosSessionStatus
    description: "Cashier session state"
    variants:
      - name: open
        description: "Accepting sales"
        default: true
      - name: closed
        description: "Reconciled + closed"
