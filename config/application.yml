server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/pos.log
module:
  name: pos
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  pos_closing_entry:
    collection: pos_closing_entries
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  pos_invoice:
    collection: pos_invoices
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  pos_invoice_item:
    collection: pos_invoice_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  pos_payment:
    collection: pos_payments
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  pos_profile:
    collection: pos_profiles
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  pos_opening_entry:
    collection: pos_opening_entries
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
